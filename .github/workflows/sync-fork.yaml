name: Sync Fork and Favor My Branch

on:
  schedule:
    - cron: "*/5 * * * *" # Runs every 5 minutes
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - name: Set up Git
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/danswer-ai/danswer.git

      - name: Fetch upstream changes
        run: git fetch upstream

      - name: Merge upstream into the current branch with "ours" strategy
        run: |
          git merge -s ours upstream/main

      - name: Push changes to the fork
        run: git push origin ${{ github.ref }}

      - name: Clean up
        run: git remote remove upstream
